kpi_family: oee
kpi_names:
  - Availability_m
  - Availability_o
  - Availability_s
  - Performance_m
  - Performance_o
  - Performance_s
  - Quality_m
  - Quality_o
  - Quality_s
  - OEE_m
  - OEE_o
  - OEE_p
  - OEE_s

description: >
  OEE (Overall Equipment Effectiveness) is Availability * Performance *
  Quality. All four KPIs (Availability, Performance, Quality, OEE) are
  precalculated at multiple levels: _m (machine wise), _o (section wise -
  Mixing, Stock, Curing, Tyre Building), _s (sub_section wise - only Stock
  has sub_sections: Extruder, 4 Roll, Bead, 3 Roll), and OEE_p (whole
  plant OEE which is avg of all section's OEE). No aggregation across levels is needed - each level is already
  calculated and stored. Drill down of OEE are Availability,Performance,Quality

variant_selection_rules:
  - if: "user mentions a specific machine"
    use: "<KPI>_m (e.g. Availability_m, OEE_m)"
  - if: "user mentions a section (mixing/stock/curing/tyre building)"
    use: "<KPI>_o"
  - if: "user mentions a sub_section (extruder/4 roll/bead/3 roll, only within Stock)"
    use: "<KPI>_s"
  - if: "user asks about the whole plant / overall OEE with no section or machine"
    use: OEE_p
  - if: "ambiguous"
    use: "<KPI>_o at the most commonly asked section, or ask for clarification if no section-like term appears"

default_select_columns:
  - date
  - machine
  - section
  - sub_section
  - actual_value
  - granularity
  - unit_of_measurement
gotchas:
  - "OEE = Availability * Performance * Quality conceptually, but OEE is already precalculated per row - never compute it manually from the other three. But if asked about the drill-down of particular OEE we can show the corresponding all three KPIs for that same date/granularity."
  - "sub_section only exists for the Stock section; do not filter on sub_section for other sections."
  - "Always filter granularity explicitly (day/month/year/shift) to avoid mixing granularities in one result."
  - "Use lower() for section, sub_section, and machine comparisons."
  - "When drilling down an OEE-family result (Availability/Performance/Quality decomposition), the new query must keep every WHERE-clause filter from the previous OEE query except kpi_name - specifically including section, sub_section, or machine if the previous query had one. Do not drop these filters; only change kpi_name to the IN (...) list,and keep the OEE-specific suffix."
  - "When the user asks for a follow-up 'drill down', 'decompose', or 'detailed view' after an OEE-family question, show Availability, Performance, and Quality KPIs with the same filters as the previous OEE query. This is NOT the Breakdown/downtime-reason KPI family, even if the user says the word 'breakdown' - that word in this context refers to breaking OEE into its components, not machine downtime reasons."
example_questions:
  - question: "What is the OEE of mixing section for the month of jan 2026?"
    sql: |
      SELECT date,section,actual_value,granularity,unit_of_measurement
      FROM gold.gold
      WHERE lower(kpi_name) = 'oee_o'
        AND lower(granularity) = 'month'
        AND lower(section) = 'mixing'
        AND date = Date '2026-01-01'

  - question: "What was overall plant OEE for July 2026?"
    sql: |
      SELECT date,section,actual_value,granularity,unit_of_measurement
      FROM gold.gold
      WHERE lower(kpi_name) = 'oee_p'
        AND lower(granularity) = 'month'
        AND date = Date '2026-07-01'

  - question: "What are the drill down for OEE of mixing section for the month for March 2026?"
    sql: |
      SELECT kpi_name,section,date,actual_value,granularity,unit_of_measurement
      FROM gold.gold
      WHERE lower(kpi_name) in ('availability_o','performance_o','quality_o')
        AND lower(granularity) = 'month'
        AND date = Date '2026-03-01'

  - question: " {What is the oee of curing for the month of july 2026} (turn 1), {then can you give me its drill-down} (turn 2)"
    sql: |
      SELECT kpi_name,section,date,actual_value,granularity,unit_of_measurement
      FROM gold.gold
      WHERE lower(kpi_name) IN ('availability_o', 'performance_o', 'quality_o')
        AND lower(granularity) = 'month'
        AND lower(section) = 'curing'
        AND date = Date '2026-07-01'